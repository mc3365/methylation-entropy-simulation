[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "methylation-entropy-simulation"
version = "0.2.0"
description = "Simulate methylation entropy reference ranges for genomic data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "pandas>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
methylation-entropy = "methylation_entropy.entropy_simulation_v2:main"
methylation-entropy-lookup = "methylation_entropy.create_lookup_v2:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
